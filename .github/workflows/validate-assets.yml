name: Validate mod assets

on:
  push:
    branches:
      - main
      - "daily/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test PNG parser against valid and corrupted fixtures
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Check block sprite sizes and Russian localization
        run: python3 tools/check_assets.py
