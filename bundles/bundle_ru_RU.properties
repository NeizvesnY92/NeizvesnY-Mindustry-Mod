block.neizvesny-mindustry-mod-neizvesny-sentinel.name = Страж NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-sentinel.description = Скорострельная двуствольная турель. Использует медь, графит и кремний. Графит повышает урон, кремний — скорострельность и добавляет слабое самонаведение пуль.
