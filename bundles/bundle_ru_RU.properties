block.neizvesny-mindustry-mod-neizvesny-bulwark.description = Большая бронированная стена.
block.neizvesny-mindustry-mod-neizvesny-bastion.name = Бастион NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-bastion.description = Тяжёлая дальнобойная двуствольная турель. Использует медь, графит и кремний. Графит повышает урон, кремний — скорострельность.
