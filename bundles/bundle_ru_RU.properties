block.neizvesny-mindustry-mod-neizvesny-wall.name = Стена NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-wall.description = Укреплённая бронированная стена.
block.neizvesny-mindustry-mod-neizvesny-sentinel.name = Страж NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-sentinel.description = Скорострельная двуствольная турель. Использует медь, графит, кремний и пиротит. Графит повышает урон и слегка отбрасывает юнитов по направлению выстрела; тяжёлые цели сопротивляются сильнее. Кремний повышает скорострельность и добавляет слабое самонаведение пуль. Пиротит поджигает цель на 3 секунды при попадании. Необязательное жидкостное охлаждение ускоряет перезарядку; без жидкости стреляет с обычным темпом.
block.neizvesny-mindustry-mod-neizvesny-bulwark.name = Стена Бастион NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-bulwark.description = Большая бронированная стена. Изолирует электрические дуги и поглощает лазеры, поддерживающие эту механику. Может отражать обычные снаряды; чем выше урон, тем меньше шанс отражения. Для строительства нужны пластик и фазовая ткань.
block.neizvesny-mindustry-mod-neizvesny-bastion.name = Бастион NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-bastion.description = Тяжёлая дальнобойная двуствольная турель. Использует медь, графит, кремний, торий и взрывчатую смесь. Ториевые снаряды наносят 60 урона, игнорируя броню юнитов, и останавливаются на первой цели. Разрывные снаряды наносят 35 прямого урона и до 35 урона взрывом в радиусе 3 клеток. Графит повышает урон и пробивает до двух юнитов; здания останавливают снаряд. Кремний повышает скорострельность.
