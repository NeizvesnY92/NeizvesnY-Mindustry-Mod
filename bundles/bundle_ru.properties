block.neizvesny-mindustry-mod-neizvesny-wall.name = Стена NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-wall.description = Укреплённая бронированная стена.
block.neizvesny-mindustry-mod-neizvesny-sentinel.name = Страж NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-sentinel.description = Скорострельная двуствольная турель. Использует медь, графит, кремний и пиротит. Графит повышает урон, кремний — скорострельность и добавляет слабое самонаведение пуль. Пиротит поджигает цель на 3 секунды при попадании.
block.neizvesny-mindustry-mod-neizvesny-bulwark.name = Стена Бастион NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-bulwark.description = Большая бронированная стена. Изолирует электрические дуги и поглощает лазеры, поддерживающие эту механику. Для строительства нужен пластик.
block.neizvesny-mindustry-mod-neizvesny-bastion.name = Бастион NeizvesnY
block.neizvesny-mindustry-mod-neizvesny-bastion.description = Тяжёлая дальнобойная двуствольная турель. Использует медь, графит и кремний. Графит повышает урон и пробивает до двух юнитов; здания останавливают снаряд. Кремний повышает скорострельность.
